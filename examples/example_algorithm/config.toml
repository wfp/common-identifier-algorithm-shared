[meta]
id="ANY"
version="1.0.0"
signature="f2789d9afdb774d88be5998aa37bdb78"

[source]
columns = [
    { name = "ID",       alias = "id"   },
    { name = "Column 2", alias = "col2" },
    { name = "Column 3", alias = "col3" },
]

[validations]

"*" = [ { op = "max_field_length", value = 200 } ]

id = [
    { op = "field_type", value = "string" },
    { op = "regex_match", value = '(\d{11})', message="must be 11 numeric digits" }
]

[algorithm]

[algorithm.columns]
process = []
static = [
    "id",
]
reference = []

[algorithm.hash]
strategy = "SHA256"

[destination]
columns = [
    { name = "Common Identifier", alias = "hashed_id" },
]
prefix = "OUTPUT-"
postfix = "-{{yyyyMMddHHmm}}"

[destination_map]
columns = [
    { name = "ID",       alias = "id" },
    { name = "Common Identifier", alias = "hashed_id" }
]
prefix = "MAPPING-"
postfix = "-{{yyyyMMddHHmm}}"

[destination_errors]
columns = [
    { name = "Errors",            alias = "errors" },
    { name = "ID",                alias = "id" },
]
prefix = "ERRORS-"
postfix = "-{{yyyyMMddHHmm}}"

